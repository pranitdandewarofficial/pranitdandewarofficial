<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#151322"><title>PRANIT VIBES</title>
<style>
:root{color-scheme:dark;--bg:#151322;--panel:#211e32;--lime:#c8fa74;--muted:#aaa7bd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:15px system-ui,-apple-system,sans-serif}header{padding:24px 18px 18px;background:linear-gradient(135deg,#292343,#151322)}.eyebrow{color:var(--lime);font-size:11px;font-weight:800;letter-spacing:2px}h1{font-size:30px;margin:5px 0}p{color:var(--muted);margin:5px 0 15px}.wrap{padding:14px}.search,textarea{width:100%;border:1px solid #403a57;background:#211e32;color:white;border-radius:12px;padding:13px;font:inherit;outline:none}.tabs{display:flex;gap:8px;overflow:auto;padding:12px 0}.tab,button{border:0;border-radius:10px;padding:10px 13px;background:#302b45;color:white;font-weight:700;white-space:nowrap}.tab.active,button.primary{background:var(--lime);color:#171525}.track{display:flex;align-items:center;gap:11px;padding:12px;margin:8px 0;background:var(--panel);border:1px solid #302b45;border-radius:14px}.num{width:32px;height:32px;display:grid;place-items:center;background:#302b45;border-radius:9px;color:var(--lime);font-weight:800}.meta{flex:1;min-width:0}.title{font-weight:700;overflow-wrap:anywhere}.sub{font-size:12px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:6px}.actions button{padding:9px;font-size:12px}.pill{font-size:11px;color:var(--lime);background:#302b45;border-radius:30px;padding:5px 8px}.section{font-size:12px;letter-spacing:1px;color:var(--muted);font-weight:800;margin:18px 0 8px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tools button{flex:1}.count{color:var(--lime);font-weight:800}.empty{padding:30px 10px;text-align:center;color:var(--muted)}footer{padding:22px;color:var(--muted);font-size:12px;text-align:center}
</style></head><body>
<header><div class="eyebrow">YOUR MUSIC. YOUR MOOD.</div><h1>PRANIT VIBES <span style="color:#c8fa74">♫</span></h1><p>I-Popstar · MTV Hustle · Legacy artists</p><span class="pill">TRACK FINDER & PLAYLIST HELPER</span></header>
<div class="wrap">
<input id="search" class="search" placeholder="Search songs or artists…" autocomplete="off">
<div class="tabs"><button class="tab active" data-cat="All">All tracks</button><button class="tab" data-cat="I-Popstar S1">I-Popstar S1</button><button class="tab" data-cat="I-Popstar S2">I-Popstar S2</button><button class="tab" data-cat="MTV Hustle">MTV Hustle</button><button class="tab" data-cat="Legacy">Legacy</button><button class="tab" data-cat="My list">My list</button></div>
<div class="tools"><button class="primary" id="copy">Copy my list</button><button id="export">Export TXT</button><button id="pasteBtn">Add song</button></div>
<div id="pasteBox" hidden><textarea id="paste" rows="3" placeholder="Paste song titles, one per line"></textarea><div class="tools"><button class="primary" id="import">Import titles</button></div></div>
<div class="section">YOUR COLLECTION · <span class="count" id="count">0</span> TRACKS</div><div id="list"></div>
<footer>Open the search button to find the exact recording on JioSaavn. This helper does not ask for your password or OTP and cannot directly modify your account.</footer>
</div>
<script>
const tracks=[
["Rukk Jao Na","Inderjeet Singh","I-Popstar S1"],["O Kadambari","Rohit Raut","I-Popstar S1"],["Eye Contact","Jaya Rohilla","I-Popstar S1"],["Jantar Dekha","Anurag Srivastava","I-Popstar S1"],["Nightmares","Maan Panu","I-Popstar S1"],["Birjuri","Riya Goley","I-Popstar S1"],["Tum Jo Baahon Mein","Elvis Massey","I-Popstar S1"],["Meri Banke","Charan","I-Popstar S1"],["Kyun","Rishabh Panchal","I-Popstar S1"],["Raat","Radhika Bhide","I-Popstar S1"],["Na Miley Kabhi","Rishabh Panchal","I-Popstar S1"],["Pyaar Ke Naam","Radhika Bhide","I-Popstar S1"],["Sab Ho Jayega","Maan Panu","I-Popstar S1"],["Tair Samandar","Anurag Srivastava","I-Popstar S1"],["She's The Drama","Riya Goley","I-Popstar S1"],["Punha Punha","Radhika Bhide","I-Popstar S1"],
["No Fear Guy","Chetanya Vaish","I-Popstar S2"],["Chal Pada","Markio Tanaldo","I-Popstar S2"],["Ittefaq","Heeya Tikku","I-Popstar S2"],["Moh Maya","Saah Goswami","I-Popstar S2"],["Dilrooba","Arya Rajurkar","I-Popstar S2"],["Sharare","Rukhsar Bandookia","I-Popstar S2"],
["Jhoot","Harmeeet","MTV Hustle"],["Roti","Harmeeet","MTV Hustle"],["Banjare","Harmeeet","MTV Hustle"],["MAATI","MTV Hustle","MTV Hustle"],["Alpha Mentality","MTV Hustle","MTV Hustle"],["She Wanna Play","OG Tehran","MTV Hustle"],["Carnivorous","Parv Music, whysoKai","MTV Hustle"],["Satark","Parv Music","MTV Hustle"],["Da Vinci","Parv Music","MTV Hustle"],["Mridul Ke Chhand","R-Mridul","MTV Hustle"],["2 Tuk Jawaab","Raaj Babu","MTV Hustle"],["Dhingana","99side","MTV Hustle"],["Sapne","Lashcurry","MTV Hustle"],["Rock Paper Scissors","Siyaahi","MTV Hustle"],["Jalaluddin","Gravity","Legacy"],["Dukandaar","Gravity","Legacy"],["Babam Bam","Paradox","Legacy"],["3:59 AM","DIVINE","Legacy"],["Kaam 25","DIVINE","Legacy"],["Mirchi","DIVINE, MC Altaf","Legacy"],["Chal Bombay","DIVINE","Legacy"],["Mere Gully Mein","DIVINE, Naezy","Legacy"],["Machayenge","Emiway Bantai","Legacy"],["Samajh Mein Aaya Kya","Emiway Bantai","Legacy"],["Seedha Makeover","KR$NA","Legacy"],["Freeverse Feast","KR$NA","Legacy"],["100 Bars","KR$NA","Legacy"],["Wish You Were Here","King","Legacy"],["Husn","Anuv Jain","Legacy"],["Maan Meri Jaan","King","Legacy"]
];
let mine=JSON.parse(localStorage.getItem("pv-mine")||"[]"),cat="All";
const $=id=>document.getElementById(id);
function save(){localStorage.setItem("pv-mine",JSON.stringify(mine))}
function render(){const q=$("search").value.toLowerCase();let rows=tracks.map((t,i)=>({...{t,i},mine:false}));mine.forEach((t,j)=>rows.push({t,i:tracks.length+j,mine:true}));rows=rows.filter(x=>(cat==="All"||x.t[2]===cat||(cat==="My list"&&mine.some(m=>m[0]===x.t[0])))&&(!q||x.t.join(" ").toLowerCase().includes(q)));$("count").textContent=rows.length;$("list").innerHTML=rows.length?rows.map(x=>'<div class="track"><div class="num">'+(x.i+1)+'</div><div class="meta"><div class="title">'+esc(x.t[0])+'</div><div class="sub">'+esc(x.t[1])+' · '+esc(x.t[2])+'</div></div><div class="actions"><button data-q="'+esc(x.t[0]+" "+x.t[1])+'" onclick="findSong(this.dataset.q)">Search</button>><button onclick="addMine('+x.i+')">＋</button></div></div>').join(""):'<div class="empty">No tracks found. Add your own titles.</div>'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function findSong(s){location.href="https://www.jiosaavn.com/search/"+encodeURIComponent(s)}
function addMine(i){let t=i<tracks.length?tracks[i]:mine[i-tracks.length];if(!t)return;if(!mine.some(x=>x[0]===t[0]))mine.push(t);save();render()}
$("search").addEventListener("input",render);document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));render()});
$("copy").onclick=async()=>{let txt=mine.map(t=>t.join(" — ")).join("\n");try{await navigator.clipboard.writeText(txt||"PRANIT VIBES");alert("Copied!")}catch(e){prompt("Copy your list:",txt)}};
$("export").onclick=()=>{let a=document.createElement("a"),u=URL.createObjectURL(new Blob([mine.map(t=>t.join(" — ")).join("\n")],{type:"text/plain"}));a.href=u;a.download="PRANIT-VIBES.txt";a.click();URL.revokeObjectURL(u)};
$("pasteBtn").onclick=()=>$("pasteBox").hidden=!$("pasteBox").hidden;
$("import").onclick=()=>{$("paste").value.split(/\n/).map(s=>s.trim()).filter(Boolean).forEach(s=>{if(!mine.some(t=>t[0].toLowerCase()===s.toLowerCase()))mine.push([s,"","My list"])});save();$("paste").value="";render();alert("Imported song titles")};
render();
</script></body></html>
